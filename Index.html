<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiSkill - Simulador de Tallado</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="header">
        <div class="stat-box">
            <span>TALLADOR</span>
            <span id="user-name" class="stat-value">INVITADO</span>
        </div>
        <div class="stat-box">
            <span>NIVEL</span>
            <span id="user-level" class="stat-value">1</span>
        </div>
        <div class="stat-box">
            <span>PUNTOS</span>
            <span id="user-points" class="stat-value">0</span>
        </div>
        <div class="stat-box">
            <span>RACHA</span>
            <span id="user-streak" class="stat-value">0</span>
        </div>
    </div>

    <div class="workshop-container">
        <h2 id="task-title">Nivel 1: Desbastado de CR-39</h2>
        <p id="task-desc">Haz clic y mantén presionado sobre la lente para simular el tallado circular.</p>
        
        <div class="lens-canvas" id="lens" onmousedown="startTallado()" onmouseup="stopTallado()" ontouchstart="startTallado()" ontouchend="stopTallado()">
            <div class="lens-surface" id="surface"></div>
            <div class="lens-particles" id="particles"></div>
            <span id="progress-text">0%</span>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="controls">
            <button onclick="completarPrueba()" class="btn-submit">ENTREGAR LENTE</button>
            <button onclick="resetLente()" class="btn-reset">REINTENTAR</button>
            <div class="log-box" id="log">Esperando inicio de proceso...</div>
        </div>

        <div class="achievements" id="achievements"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
